name: Bundle

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true

jobs:
  bundle:
    name: bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: ""
            args: ""
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: linux-x64
            os: ubuntu-22.04
            target: ""
            args: ""
    env:
      ENGINE_SIGNING_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      ENGINE_SIGNING_MACOS: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Add the Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.platform }}

      - run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Build and self-test the engine
        if: runner.os != 'Windows'
        run: bash scripts/build-sidecar.sh

      - name: Build and self-test the engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Sign engine
        if: runner.os == 'Windows' && env.ENGINE_SIGNING_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "engine-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Sort-Object FullName |
            Select-Object -Last 1
          $files = Get-ChildItem apps/desktop/src-tauri/binaries/engine -Recurse -File -Include *.exe, *.dll, *.pyd |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne "Valid" }
          for ($index = 0; $index -lt $files.Count; $index += 50) {
            $batch = $files[$index..([Math]::Min($index + 49, $files.Count - 1))].FullName
            & $signtool.FullName sign /sha1 $certificate.Thumbprint /fd sha256 /tr http://timestamp.digicert.com /td sha256 $batch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "signed $($files.Count) engine files"

      - name: Sign engine
        if: runner.os == 'macOS' && env.ENGINE_SIGNING_MACOS == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/sign-engine-macos.sh

      - name: Check the updater signing setup
        if: inputs.publish
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty"
            exit 1
          fi
          if ! node -e "process.exit(require('./apps/desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey ? 0 : 1)"; then
            echo "::error::plugins.updater.pubkey is empty in apps/desktop/src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Prepare the build arguments
        id: build-args
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          TARGET_ARGS: ${{ matrix.args }}
        run: |
          args="--config src-tauri/tauri.release.conf.json"
          if [ "$PUBLISH" != "true" ]; then
            no_updater="${RUNNER_TEMP//\\//}/no-updater.conf.json"
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > "$no_updater"
            args="$args --config $no_updater"
          fi
          if [ -n "$TARGET_ARGS" ]; then
            args="$args $TARGET_ARGS"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        id: tauri
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.publish && github.ref_name || '' }}
          releaseName: ${{ inputs.publish && format('vivePDF {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: ${{ steps.build-args.outputs.args }}

      - name: Install the Windows bundle
        id: windows-install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          $installDir = Join-Path $env:RUNNER_TEMP "vp"
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "installer exited with $($installer.ExitCode)" }
          "engine=$((Join-Path $installDir 'engine').Replace('\', '/'))" >> $env:GITHUB_OUTPUT

      - name: Smoke-test the Windows bundle
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/smoke-engine.sh "${{ steps.windows-install.outputs.engine }}"

      - name: Smoke-test the macOS bundle
        if: runner.os == 'macOS'
        run: |
          app="$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name "*.app" | head -n 1)"
          if [ -z "$app" ]; then
            echo "::error::macOS app bundle not found"
            exit 1
          fi
          bash scripts/smoke-engine.sh "$app/Contents/Resources/engine"

      - name: Smoke-test the Linux bundles
        if: runner.os == 'Linux'
        run: |
          bundle_dir="$PWD/apps/desktop/src-tauri/target/release/bundle"
          deb="$(find "$bundle_dir/deb" -maxdepth 1 -name "*.deb" | head -n 1)"
          appimage="$(find "$bundle_dir/appimage" -maxdepth 1 -name "*.AppImage" | head -n 1)"
          if [ -z "$deb" ] || [ -z "$appimage" ]; then
            echo "::error::deb or AppImage bundle not found"
            exit 1
          fi
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          deb_cli="$(find "$RUNNER_TEMP/deb" -path "*/engine/vivepdf-cli" -type f | head -n 1)"
          bash scripts/smoke-engine.sh "$(dirname "$deb_cli")"
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract > /dev/null)
          appimage_cli="$(find "$RUNNER_TEMP/squashfs-root" -path "*/engine/vivepdf-cli" -type f | head -n 1)"
          bash scripts/smoke-engine.sh "$(dirname "$appimage_cli")"

      - name: List the bundle files
        id: bundle-files
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          {
            echo "paths<<VIVEPDF_PATHS"
            node -e "for (const item of JSON.parse(process.env.ARTIFACT_PATHS)) console.log(item)"
            echo "VIVEPDF_PATHS"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !inputs.publish }}
        with:
          name: vivepdf-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ steps.bundle-files.outputs.paths }}
          retention-days: 7
          if-no-files-found: error
