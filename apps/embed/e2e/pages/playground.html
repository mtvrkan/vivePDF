<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vivePDF embed playground</title>
  </head>
  <body style="margin: 0">
    <script>
      window.__marks = [];
      const params = new URLSearchParams(location.search);
      const viewer = document.createElement("vive-pdf");
      viewer.dataset.testid = "viewer";
      if (params.get("src") !== "none") viewer.setAttribute("src", params.get("src") || "/fixtures/book.pdf");
      for (const name of ["theme", "lang", "load", "fonts", "print", "download", "toolbar", "search", "filename", "page", "zoom", "accent"]) if (params.has(name)) viewer.setAttribute(name, params.get(name));
      viewer.style.height = params.get("height") || "100vh";
      viewer.addEventListener("vive-mark", (event) => window.__marks.push(event.detail.name));
      window.__events = [];
      for (const name of ["vive-ready", "vive-pagechange", "vive-zoomchange", "vive-error"]) document.addEventListener(name, (event) => window.__events.push({ type: event.type, detail: event.detail }));
      document.body.append(viewer);
    </script>
    <script type="module" src="/dist/vivepdf.mjs"></script>
  </body>
</html>
