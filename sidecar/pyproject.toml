[project]
name = "vivepdf-sidecar"
version = "0.1.0"
description = "vivePDF engine sidecar — PDF operations over NDJSON JSON-RPC"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "pymupdf>=1.26",
    "pydantic>=2.11",
    "fonttools>=4.55",
    "pdf2docx==0.5.13",
    "python-docx==1.2.0",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pymupdf4llm>=0.0.20",
    "markdown-it-py>=3.0",
    "pyhanko[image-support,opentype]==0.37.0",
    "lxml>=5.4",
    "cryptography>=48",
    "zxing-cpp>=2.3",
    "pillow>=11",
    "numpy>=2",
    "piper-tts>=1.8.0",
    "pywin32>=306 ; sys_platform == 'win32'",
    "pikepdf>=10.13.0.post1",
    "pi-heif==1.4.0",
    "ctranslate2==4.8.2",
    "sentencepiece==0.2.2",
]

[project.urls]
Homepage = "https://github.com/mtvrkan/vivePDF"
Source = "https://github.com/mtvrkan/vivePDF"

[project.scripts]
vivepdf-cli = "vivepdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyinstaller>=6.14",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vivepdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
